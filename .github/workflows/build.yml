name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Initialize Project
        run: flutter create --platforms=android --org com.example --project-name rat_client .

      - name: Overwrite Main Dart
        run: cp main.dart lib/main.dart

      - name: Add Dependencies
        # KUNCI VERSI BATTERY PLUS KE 6.0.0 AGAR TIDAK ERROR GRADLE
        run: flutter pub add socket_io_client device_info_plus battery_plus:^6.0.0

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
